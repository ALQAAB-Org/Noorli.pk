<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Noorli.pk | Coming Soon</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      min-height: 100vh;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Gradient Waves */
    .background {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        120deg,
        rgba(123,47,247,0.15),
        rgba(241,7,163,0.15),
        rgba(0,198,255,0.15),
        rgba(0,242,96,0.15),
        rgba(247,151,30,0.15)
      );
      filter: blur(80px);
      z-index: -1;
    }

    .container {
      text-align: center;
      padding: 40px;
      max-width: 600px;
    }

    .logo {
      font-size: 36px;
      font-weight: 700;
      margin-bottom: 15px;
    }

    .logo span {
      background: linear-gradient(
        90deg,
        #7b2ff7,
        #f107a3,
        #00c6ff,
        #00f260,
        #f7971e
      );
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    p {
      font-size: 18px;
      color: #555;
      margin-bottom: 30px;
    }

    .coming {
      display: inline-block;
      padding: 12px 28px;
      border-radius: 30px;
      background: linear-gradient(
        90deg,
        #7b2ff7,
        #f107a3,
        #00c6ff
      );
      color: #fff;
      font-weight: 600;
      letter-spacing: 1px;
    }

    footer {
      margin-top: 40px;
      font-size: 14px;
      color: #777;
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 32px;
      }
      p {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>

  <div class="background"></div>

  <div class="container">
    <div class="logo">Noorli<span>.pk</span></div>

    <h1>Welcome to Noorli.pk</h1>
    <p>Shop Smarter, Live Better<br>Your Trusted E-commerce Partner</p>

    <div class="coming">✨ Coming Soon ✨</div>

    <footer>
      © 2026 Noorli.pk · Pakistan
    </footer>
  </div>

</body>
</html>
