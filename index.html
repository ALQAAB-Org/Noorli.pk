<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="refresh" content="0;url=https://noorli-pk.netlify.app/">
  <title>Noorli.pk | Coming Soon - Shop Smarter, Live Better</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      min-height: 100vh;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      padding: 20px;
    }

    /* Animated Gradient Background */
    .background {
      position: fixed;
      inset: 0;
      background: linear-gradient(
        120deg,
        rgba(123, 47, 247, 0.2),
        rgba(241, 7, 163, 0.2),
        rgba(0, 198, 255, 0.2),
        rgba(0, 242, 96, 0.2),
        rgba(247, 151, 30, 0.2)
      );
      filter: blur(80px);
      z-index: -2;
      animation: gradientShift 20s ease infinite;
      background-size: 400% 400%;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Floating particles */
    .particles {
      position: fixed;
      width: 100%;
      height: 100%;
      z-index: -1;
    }

    .particle {
      position: absolute;
      border-radius: 50%;
      background: rgba(123, 47, 247, 0.1);
      animation: float 15s infinite linear;
    }

    @keyframes float {
      0% { transform: translateY(0) rotate(0deg); opacity: 0.7; }
      100% { transform: translateY(-1000px) rotate(720deg); opacity: 0; }
    }

    .container {
      text-align: center;
      padding: 50px 40px;
      max-width: 700px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.3);
      animation: fadeIn 1s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .logo {
      font-size: 48px;
      font-weight: 800;
      margin-bottom: 20px;
      letter-spacing: -1px;
    }

    .logo span {
      background: linear-gradient(
        90deg,
        #7b2ff7,
        #f107a3,
        #00c6ff,
        #00f260,
        #f7971e
      );
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: logoGlow 3s ease-in-out infinite alternate;
    }

    @keyframes logoGlow {
      0% { filter: drop-shadow(0 0 5px rgba(123, 47, 247, 0.3)); }
      100% { filter: drop-shadow(0 0 15px rgba(241, 7, 163, 0.4)); }
    }

    h1 {
      font-size: 46px;
      margin-bottom: 15px;
      background: linear-gradient(90deg, #1a1a1a, #4a4a4a);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.2;
    }

    .tagline {
      font-size: 22px;
      color: #555;
      margin-bottom: 25px;
      font-weight: 500;
      line-height: 1.4;
    }

    .highlight {
      color: #7b2ff7;
      font-weight: 600;
    }

    .coming {
      display: inline-block;
      padding: 14px 32px;
      border-radius: 50px;
      background: linear-gradient(
        90deg,
        #7b2ff7,
        #f107a3,
        #00c6ff
      );
      color: #fff;
      font-weight: 600;
      letter-spacing: 0.5px;
      font-size: 18px;
      margin-bottom: 40px;
      box-shadow: 0 8px 25px rgba(123, 47, 247, 0.3);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 8px 25px rgba(123, 47, 247, 0.3); }
      50% { box-shadow: 0 8px 30px rgba(123, 47, 247, 0.5); }
      100% { box-shadow: 0 8px 25px rgba(123, 47, 247, 0.3); }
    }

    /* New Button Styles */
    .button-container {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      margin-bottom: 40px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px 32px;
      border-radius: 50px;
      font-weight: 600;
      font-size: 16px;
      text-decoration: none;
      transition: all 0.3s ease;
      cursor: pointer;
      border: none;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
    }

    .btn-primary {
      background: linear-gradient(90deg, #7b2ff7, #f107a3);
      color: white;
    }

    .btn-secondary {
      background: white;
      color: #7b2ff7;
      border: 2px solid #7b2ff7;
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
    }

    .btn-primary:hover {
      background: linear-gradient(90deg, #6a1ce6, #d90690);
    }

    .btn-secondary:hover {
      background: rgba(123, 47, 247, 0.05);
    }

    .features {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 25px;
      margin-bottom: 40px;
    }

    .feature {
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 150px;
    }

    .feature-icon {
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, #7b2ff7, #00c6ff);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      color: white;
      font-size: 24px;
      box-shadow: 0 8px 20px rgba(123, 47, 247, 0.2);
    }

    .feature-text {
      font-size: 14px;
      font-weight: 600;
      color: #333;
    }

    footer {
      margin-top: 40px;
      font-size: 14px;
      color: #777;
      border-top: 1px solid rgba(0, 0, 0, 0.08);
      padding-top: 20px;
    }

    .social-icons {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
    }

    .social-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(123, 47, 247, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #7b2ff7;
      font-size: 18px;
      transition: all 0.3s ease;
      text-decoration: none;
    }

    .social-icon:hover {
      background: #7b2ff7;
      color: white;
      transform: translateY(-3px);
    }

    @media (max-width: 768px) {
      .container {
        padding: 40px 25px;
        margin: 20px;
      }
      
      .logo {
        font-size: 40px;
      }
      
      h1 {
        font-size: 36px;
      }
      
      .tagline {
        font-size: 18px;
      }
      
      .button-container {
        flex-direction: column;
        align-items: center;
      }
      
      .btn {
        width: 100%;
        max-width: 300px;
      }
      
      .features {
        gap: 20px;
      }
      
      .feature {
        max-width: 130px;
      }
    }

    @media (max-width: 480px) {
      .logo {
        font-size: 34px;
      }
      
      h1 {
        font-size: 30px;
      }
      
      .tagline {
        font-size: 16px;
      }
      
      .coming {
        font-size: 16px;
        padding: 12px 24px;
      }
      
      .feature {
        max-width: 110px;
      }
      
      .feature-icon {
        width: 50px;
        height: 50px;
        font-size: 20px;
      }
    }
  </style>
</head>
<body>

  <div class="background"></div>
  
  <!-- Floating particles -->
  <div class="particles" id="particles-container"></div>

  <div class="container">
    <div class="logo">Noorli<span>.pk</span></div>

    <h1>Welcome to Noorli.pk</h1>
    <p class="tagline">Shop Smarter, Live Better<br><span class="highlight">Your Trusted E-commerce Partner</span></p>

    <div class="coming">✨ Coming Soon ✨</div>

    <div class="button-container">
      <a href="https://noorli-pk.netlify.app/" target="_blank" class="btn btn-primary">
        <i class="fas fa-external-link-alt"></i> Visit Our Website
      </a>
      <button class="btn btn-secondary" id="notifyBtn">
        <i class="fas fa-bell"></i> Notify Me
      </button>
    </div>

    <div class="features">
      <div class="feature">
        <div class="feature-icon">
          <i class="fas fa-shipping-fast"></i>
        </div>
        <div class="feature-text">Fast Delivery</div>
      </div>
      <div class="feature">
        <div class="feature-icon">
          <i class="fas fa-shield-alt"></i>
        </div>
        <div class="feature-text">Secure Shopping</div>
      </div>
      <div class="feature">
        <div class="feature-icon">
          <i class="fas fa-tags"></i>
        </div>
        <div class="feature-text">Best Prices</div>
      </div>
      <div class="feature">
        <div class="feature-icon">
          <i class="fas fa-headset"></i>
        </div>
        <div class="feature-text">24/7 Support</div>
      </div>
    </div>

    <footer>
      © 2026 Noorli.pk · Pakistan
      <div class="social-icons">
        <a href="#" class="social-icon">
          <i class="fab fa-facebook-f"></i>
        </a>
        <a href="#" class="social-icon">
          <i class="fab fa-twitter"></i>
        </a>
        <a href="#" class="social-icon">
          <i class="fab fa-instagram"></i>
        </a>
        <a href="#" class="social-icon">
          <i class="fab fa-linkedin-in"></i>
        </a>
      </div>
    </footer>
  </div>

  <script>
    // Create floating particles
    function createParticles() {
      const particlesContainer = document.getElementById('particles-container');
      const colors = ['#7b2ff7', '#f107a3', '#00c6ff', '#00f260', '#f7971e'];
      
      for (let i = 0; i < 25; i++) {
        const particle = document.createElement('div');
        particle.classList.add('particle');
        
        // Random properties
        const size = Math.random() * 60 + 20;
        const color = colors[Math.floor(Math.random() * colors.length)];
        const left = Math.random() * 100;
        const duration = Math.random() * 20 + 10;
        const delay = Math.random() * 5;
        
        particle.style.width = `${size}px`;
        particle.style.height = `${size}px`;
        particle.style.background = `rgba(${parseInt(color.slice(1,3), 16)}, ${parseInt(color.slice(3,5), 16)}, ${parseInt(color.slice(5,7), 16)}, 0.1)`;
        particle.style.left = `${left}%`;
        particle.style.animationDuration = `${duration}s`;
        particle.style.animationDelay = `${delay}s`;
        
        particlesContainer.appendChild(particle);
      }
    }
    
    // Notify button functionality
    document.getElementById('notifyBtn').addEventListener('click', function() {
      const originalText = this.innerHTML;
      this.innerHTML = '<i class="fas fa-check"></i> Notified!';
      this.style.background = 'linear-gradient(90deg, #00f260, #00c6ff)';
      
      setTimeout(() => {
        this.innerHTML = originalText;
        this.style.background = '';
      }, 2000);
    });
    
    // Initialize particles on load
    window.addEventListener('load', createParticles);
    
    // Add subtle mouse movement effect to container
    document.addEventListener('mousemove', function(e) {
      const container = document.querySelector('.container');
      const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
      const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
      
      container.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
    });
  </script>
</body>
</html>
